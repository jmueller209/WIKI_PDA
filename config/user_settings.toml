# Here you can customize your database. Changing any of the settings below will maintain compatibility
# with the Query API as long as the the versions are compatible.
[database_content]
language_to_include = ["en", "de", "es"]

# All entries that have a wikipedia article in one of the configured languages will be
# added automatically. If you want to add any concepts that do not have a wikipedia article,
# you can do this by adding classes to 'include_concepts_with_given_property_in_omni_search_index'.
# You might want to do this because those concepts might still have helpful
# metadata (e.g., the year of birth of a human that is not famous enough to have a Wikipedia
# article but still has an entry in the database). If one of the filters applies, the concept
# will be included.
#
# Here is a list of the most important classes you might want to include:
#
# People & Groups:
# - Q5: Human
# - Q43229: Organization (Companies, institutions, political parties, groups)
#
# Geography & Places:
# - Q515: City
# - Q511: Capital city
# - Q625: Country
# - Q486972: Human settlement
# - Q3863: Mountain
#
# History & Events:
# - Q13418847: Historical event (Battles, treaties, disasters, turning points)
# - Q1190554: Current event / occurrence (Notable modern happenings)
#
# Culture, Art & Media:
# - Q11424: Film / Motion picture
# - Q7725634: Literary work (Books, novels)
# - Q3305213: Painting (Artworks)
# - Q7889: Video game
# - Q4022: Musical work / Album / Song
include_concepts_with_given_property_in_omni_search_index = [
    "Q5", "Q515", "Q511", "Q625", "Q3305213", "Q11424", "Q7725634", "Q486972"
]

# Set this to true if you want to create an additional search index to look up coordinates quickly.
# All entries that have coordinate metadata will be included here. If you set
# 'include_all_matches_in_globe_coordinate_search_index' to true, EVERYTHING that has coordinates
# will be included. Otherwise, only the entries that have a Wikipedia article and
# have coordinates will be included.
create_globe_coordinate_search_index                 = true
include_all_matches_in_globe_coordinate_search_index = true

# Set this to true if you want to create an additional search index to look up temporal data quickly.
# All entries that have temporal metadata will be included here. If you set
# 'include_all_matches_in_temporal_search_index' to true, EVERYTHING that has temporal metadata
# will be included. Otherwise, only the entries that have a Wikipedia article and
# contain temporal metadata will be included. You can again specify tags like before.
#
# The kinds of temporal properties that will trigger an inclusion in the temporal search index are:
# - P569 (Date of birth): Used for people and animals.
# - P570 (Date of death): Used for people and animals.
# - P571 (Inception / Creation): Used for things that are "created" or "established" rather than born.
# - P580 (Start time): Used for events, historical periods, or conditions.
# - P582 (End time): Used for the conclusion of events, historical periods, or roles.
create_temporal_search_index                 = true
include_all_matches_in_temporal_search_index = true

# Set this to true if you want to create an additional search index for astronomical objects.
create_astronomical_search_index                 = true
include_all_matches_in_astronomical_search_index = true

# Specify which astronomical objects to include in the astronomical search index.
# Here is the core list of important astronomical QIDs:
# - Q523: Star
# - Q318: Galaxy
# - Q634: Planet
# - Q2537: Natural satellite / Moon
# - Q3559: Comet
# - Q1022867: Minor planet / Asteroid
astronomical_objects_to_include = ["Q523", "Q318", "Q634", "Q2537", "Q3559", "Q1022867"]

# Maximum apparent magnitude limit for astronomical objects to be included.
# Note: The magnitude scale is reverse logarithmic—lower (and even negative) numbers
# mean brighter objects. For reference:
# - Minus numbers (-1.46 for Sirius, -26.7 for the Sun) are extremely bright.
# - +6.0 is roughly the limit of what the human eye can see on a clear, dark night.
# - +10.0 and above include millions of faint stars requiring telescopes.
max_apparent_magnitude = 6.5

# Specify which property datatypes should be included in the metadata. Excluding specific metadata
# will not affect the specialized search indexes like the coordinate search index.
# Here is a list of all available datatypes:
# external-id, commonsMedia, url, string, quantity, math, wikibase-item, time,
# musical-notation, wikibase-form, globe-coordinate, geo-shape, wikibase-lexeme,
# monolingualtext, wikibase-property, wikibase-sense, tabular-data 
property_datatypes_to_include_in_metadata = [
    "string", "quantity", "math", "wikibase-item", "time", "musical-notation", 
    "globe-coordinate", "geo-shape", "monolingualtext", "wikibase-property", "tabular-data"
]

# Change these URLs if the source locations change in the future.
[urls]
wikidata_dump_url = "https://dumps.wikimedia.org/other/wikibase/wikidatawiki/latest-all.json.gz"
wikipedia_base_url = "https://ftp.fau.de/kiwix/zim/wikipedia/"

# These patterns are used to match the ZIM files for Wikipedia articles in different languages.
# You only need to change these if the patterns change in the future. Make sure to use single quotes here.
[match_patterns]
wikipedia_zim_file_match_pattern = 'wikipedia_{lang}_all_nopic_(\d{4}-\d{2})\.zim'

# These are the local paths the database generator uses. Keeping the default ones should work.
[paths]
wikidata_dump_path   = "./data/wikidata/latest-all.json.gz"
data_dir             = "./data"
bin_dir              = "./bin"
log_dir              = "./logs"
tmp_dir              = "./tmp"
checkpoint_dir       = "./checkpoints"
example_articles_dir = "./example_articles"

# Here you can specify some performance-related metrics for parsing the large data files.
# Adjust these values based on your system's capabilities and the size of the data you are processing.
[performance]

# Number of threads used for the database generation. For best performance, set this to the
# number of cores/threads your CPU has. This will not affect the performance of the database
# itself, only the time it takes to generate it. 
thread_count = 16

# Size of the buffer in kilobytes for reading files from disk and writing to files during the
# database generation phase. This only affects the performance during the database generation
# phase and not the performance of the database itself.
read_buffer_size_kb  = 16384 
write_buffer_size_kb = 32768

# Maximum amount of RAM in megabytes that the database generator is allowed to use.
# This will not affect the RAM usage of the database itself, only the generation process.
# ram_limit_mb = 8192
# ram_limit_mb = 16384
ram_limit_mb = 12000

# Size of the Zstandard dictionary used for compression and decompression. A larger dictionary
# can improve compression rate but will use more RAM. If you plan to use this database on a
# microcontroller or another system with very limited RAM, make sure to set this to a value
# that is supported.
zstd_dict_size_kb = 32

# Size of the sample data used to train the Zstandard dictionary. A larger sample size can
# improve compression rate but will also cause the training process to take longer. This will
# only affect the initial creation of the database and not the usage of it.
zstd_dict_training_sample_size_mb = 5

# The Zstandard compression level (1-22) used for compressing the articles. Values range
# from 1 (fastest generation, larger database) to 22 (slowest generation, smallest database).
# Levels above 19 are ultra-compression modes and will significantly increase generation time.
# This does not affect decompression speed while using the database.
zstd_compression_level = 3

# The maximum sliding window size in kilobytes used by Zstandard during compression.
# As this is also used for decompression, make sure this fits in the RAM of the system
# you plan to use the database on. 
zstd_window_size_kb = 32

# Specify the maximum amount of RAM in kilobytes that the top-level sparse index of the
# each search index is allowed to use. This affects the performance of the database while
# searching. Increasing the size here is generally better for performance if you have enough
# RAM available. If you set this to 0, no sparse index will be created.
omni_search_sparse_index_ram_limit_kb = 32
globe_coordinate_search_index_ram_limit_kb = 32
temporal_search_index_ram_limit_kb = 32
astronomical_search_index_ram_limit_kb = 32

# Specify the chunk size in bytes for the omni search index. This will affect how many
# sparse index levels are created. A smaller chunk size will create more levels which will
# cause more random reads during the search. However, if the chunk size is too large,
# the binary search performed on the sparse indexes will be slower. I recommend setting
# this to the largest possible value that fits into the cache of your SD card or hard drive
# to avoid slow random reads while ensuring a minimum number of sparse index levels.
omni_search_chunk_size_bytes = 8192
globe_coordinate_search_chunk_size_bytes = 8192
temporal_search_chunk_size_bytes = 8192
astronomical_search_chunk_size_bytes = 8192

[other]
delete_source_binaries_after_merge = false
delete_tmp_dir_after_generation = false
