wikiquote_zim_file_match_pattern = 'wikiquote_{lang}_all_nopic_(\d{4}-\d{2})\.zim' #TODO: Check if this is still correct
wikisource_zim_file_match_pattern = 'wikisource_{lang}_all_nopic_(\d{4}-\d{2})\.zim' #TODO: Check if this is still correct
wikivoyage_zim_file_match_pattern = 'wikivoyage_{lang}_all_nopic_(\d{4}-\d{2})\.zim' #TODO: Check if this is still correct
wikinews_zim_file_match_pattern = 'wikinews_{lang}_all_nopic_(\d{4}-\d{2})\.zim' #TODO: Check if this is still correct
wikiversity_zim_file_match_pattern = 'wikiversity_{lang}_all_nopic_(\d{4}-\d{2})\.zim' #TODO: Check if this is still correct
wikibooks_zim_file_match_pattern = 'wikibooks_{lang}_all_nopic_(\d{4}-\d{2})\.zim' #TODO: Check if this is still correct


# These are the local paths where the downloaded files will be stored. Keeping the default ones should work.
[paths]
wikidata_dump_path = "./data/wikidata/latest-all.json.gz"
# language_config_path = "./config/languages.config"
language_config_path = "./config/languages_backup.config"
data_dir = "./data"
bin_dir = "./bin"
log_dir = "./logs"
tmp_dir = "./tmp"
checkpoint_dir = "./checkpoints"


# Here you can specify some performace-related metrics for parsing the large data files. Adjust these values based on your system's capabilities and the size of the data you are processing.
[performance]
# Number of threads used for the database generation. For best performance, set this to the number of cores/threads your CPU has. This will not affect the performance of the database itself, only the time it takes to generate it. 
thread_count = 16

# Size of the buffer in kilobytes for reading files from disk and writing to files during the database generation phase. This only affects the performance during the database generation phase and not the performance of the database itself.
read_buffer_size_kb = 16384 
write_buffer_size_kb= 32768

# Maximum amount of RAM in megabytes that the database generator is allowed to use. This will not affect the RAM usage of the database itself, only the generation process.
# ram_limit_mb = 8192
# ram_limit_mb = 16384
ram_limit_mb = 12000

# Size of the Zstandard dictionary used for compression and decompression. A larger dictionary can improve compression rate but will use more RAM. If you plan to use this database on a microcontroller or another system with very limited RAM, make sure to set this to a value that is supported.
zstd_dict_size_kb = 128 

 # Size of the sample data used to train the Zstandard dictionary. A larger sample size can improve compression rate but will also cause the training process to take longer. This will only affect the initial creation of the database and not the usage of it. 
zstd_dict_training_sample_size_mb = 5 

# The Zstandard compression level (1-22) used for compressing the articles. Values range from 1 (fastest generation, larger database) to 22 (slowest generation, smallest database). Levels above 19 are ultra-compression modes and will significantly increase generation time. This does not affect decompression speed while using the database.
zstd_compression_level = 3

# The maximum sliding window size in kilobytes used by Zstandard during compression. As this is also used for decompression, make sure this fits in the RAM of the system you plan to use the database on. 
# zstd_window_size_kb = 32
zstd_window_size_kb = 32

# Specify how many bytes should be used to encode the search term in the omni search index. If you use more bytes, the search index will be larger but it becomes less likely that search terms are truncated. If you use less bytes, the search index will be smaller but it might happen that search terms do not fit into the allocated space and are truncated. The database generator will automatically add bytes for the encoding if the specified number does not meet memory alignment requirements. Therefore, this value is only a minimum value.
omni_search_index_term_encoding_bytes = 20

# Specify the maximum amount of RAM in kilobytes that the the top level sparse index of the omni search index is allowed to use. This affects the perfomance of the database while searching. Increaseing the size here is generally better for performance if you have enough RAM available. If you set this to 0 no sparse index will be created.
omni_search_sparse_index_ram_limit_kb = 32

# Specify the chunk size in bytes for the omni search index. This will affect how many sparse index levels are created. A smaller chunk size will create more levels which will cause more random reads during the search. However, if the chunk size is too large, the binary search performed on the sparse indexes will be slower. I recommend setting this to the largest possible value that fits into the cache of you SD card or hard drive to avoid slow random reads while ensuring a minimum number of sparse index levels.
omni_search_chunk_size_bytes = 8192

# This pattern is used to match the ZIM files for Wikipedia articles in different languages. You only need to change this if the pattern changes in the future. Make sure to use single quotes here.
[other]
# Text Delimiter used in temporary text files. Make sure to use a character that is not used in any of the data.
text_delimiter = "\t" # We need to use double quotes here, otherwise '\' and 't' are read as two individual characters.
