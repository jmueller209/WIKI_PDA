[package]
name = "shared"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["staticlib", "lib"]

[build-dependencies]
cbindgen = "0.29"

[dependencies]
rusqlite = { version = "0.31.0", features = ["bundled"] }
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13"
html2text = "0.12"
kuchikiki = "0.8"
