[package]
name = "db_generator"
version = "0.1.0"
edition = "2024"

[dependencies]
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
config = "0.13"
rayon = "1.8"
crossbeam-channel = "0.5.16"
shared = {path = "../shared"}
regex = "1.10.0"
zim = "0.5.0"
indicatif = "0.17"
rand = "0.8"
urlencoding = "2.1.3"
redb = "2.1"
kuchikiki = "0.8.2"
zstd = "0.13.3"
html2text = "0.17.1"
reqwest = { version = "0.13.4", features = ["blocking"] }
scraper = "0.27.0"
sysinfo = "0.39.6"
